<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1c1b19">
<meta name="description" content="Pixel Island: eat lower-level creatures and evolve from level 1 to level 10.">
<title>Pixel Island</title>
<!-- The card a chat or a social app shows for a link. The image address has to be absolute, so a copy of the
     game served from another address needs these two addresses changed. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Pixel Island">
<meta property="og:description" content="Eat lower-level creatures and evolve from level 1 to level 10. A pixel-art game that runs in the browser.">
<meta property="og:url" content="https://felix-hwang.github.io/Pixel-Island/">
<meta property="og:image" content="https://felix-hwang.github.io/Pixel-Island/icons/social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="src/ui/style.css">
</head>
<body>
<div id="stage"><canvas id="c" aria-label="Pixel Island"></canvas></div>
<progress id="loading" aria-label="Loading"></progress>
<div id="hud" hidden>
  <div class="line"><span id="hud-level"></span><span id="hud-name"></span><span id="hud-grade"></span></div>
  <div id="hud-pips" role="img"></div>
  <div id="hud-count" hidden></div>
  <div id="hud-status"></div>
</div>
<div id="side">
  <div class="top">
    <div id="map-name"></div>
    <button id="exit" type="button" data-sound="back" hidden>
      <svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" aria-hidden="true">
        <rect x="1" y="1" width="14" height="14" fill="#2e9e5b"/><rect x="8" y="3" width="5" height="10" fill="#fff"/>
        <rect x="11" y="8" width="1" height="1" fill="#2e9e5b"/><path d="M2 8h4M4 6l2 2-2 2" stroke="#fff" stroke-width="1.4" fill="none"/>
      </svg>
    </button>
  </div>
  <div id="toasts" role="status" aria-live="polite"></div>
</div>
<div id="stick-base" hidden></div><div id="stick-knob" hidden></div>
<dialog id="screen" closedby="none" aria-labelledby="screen-title"></dialog>

<!-- Load order matters: every file is a plain script that adds to the global PI object. All paths are relative.
     Language files and map files are not listed here. src/core/loader.js fetches the ones a visit needs. -->
<script src="src/core/namespace.js"></script>
<script src="src/core/config.js"></script>
<script src="src/core/loader.js"></script>
<script src="src/core/settings.js"></script>
<script src="src/core/audio.js"></script>

<!-- words: the strings themselves are loaded on demand -->
<script src="src/i18n/i18n.js"></script>

<!-- renderer -->
<script src="src/gfx/screen.js"></script>
<script src="src/gfx/color.js"></script>
<script src="src/gfx/shapes.js"></script>
<script src="src/gfx/box.js"></script>
<script src="src/gfx/shadow.js"></script>
<script src="src/gfx/outline.js"></script>
<script src="src/gfx/wind.js"></script>

</body>
</html>
